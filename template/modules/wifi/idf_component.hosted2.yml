# append under `dependencies:` in main/idf_component.yml - option A (recommended):
# the same esp_hosted major as Elecrow's C6 firmware (2.12.3)
  espressif/esp_hosted:
    version: "~2.12.3"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.3"            # the last esp_wifi_remote that keeps esp_hosted < 3.0
    rules:
      - if: "target == esp32p4"
